<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clima · OpenWeatherMap + ASP.NET Core</title>

  <!-- estilos.css pisa clases de Leaflet, así que va después. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/estilos.css" />
</head>
<body>
  <div class="app">
    <h1>Clima <span>·</span> ASP.NET Core + OpenWeatherMap</h1>

    <div class="search">
      <label class="sr-only" for="ciudad">Ciudad</label>
      <input id="ciudad" type="text" placeholder="Bariloche, Buenos Aires, Madrid..." />
      <button id="buscar">Buscar</button>
    </div>

    <!-- Un solo nodo para "Buscando..." y para los errores. -->
    <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <div class="layout">
      <div>
        <!-- El JS reemplaza #mapaBox entero si Leaflet no cargó. -->
        <div id="mapaBox">
          <div id="map"></div>
        </div>
        <div class="hint" id="mapaHint">Hacé clic en el mapa para ver el clima de ese punto</div>
      </div>

      <!-- El JS escribe por id, así que el orden es sólo jerarquía visual. -->
      <div class="card" id="card">
        <img class="icon" id="icono" alt="" />
        <div class="temp" id="temp"></div>
        <div class="city" id="ciudadNombre"></div>
        <div class="desc" id="descripcion"></div>

        <div class="grid">
          <div class="stat"><div class="label">Sensación</div><div class="value" id="sensacion"></div></div>
          <div class="stat"><div class="label">Humedad</div><div class="value" id="humedad"></div></div>
          <div class="stat"><div class="label">Viento</div><div class="value" id="viento"></div></div>
        </div>
      </div>
    </div>

    <div class="forecast" id="forecast">
      <h2 id="forecastTitulo">Pronóstico</h2>
      <div class="days" id="days"></div>
    </div>

    <footer class="pie">
      <a href="https://github.com/camiloquirogadev" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
        </svg>
        GitHub
      </a>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const card = $("card"), forecast = $("forecast"), msg = $("msg"), boton = $("buscar");

    // Código de OpenWeather ("04d") -> SVG local de Meteocons.
    const METEO = {
      "01d": "clear-day",              "01n": "clear-night",
      "02d": "partly-cloudy-day",      "02n": "partly-cloudy-night",
      "03d": "cloudy",                 "03n": "cloudy",
      "04d": "overcast-day",           "04n": "overcast-night",
      "09d": "drizzle",                "09n": "drizzle",
      "10d": "partly-cloudy-day-rain", "10n": "partly-cloudy-night-rain",
      "11d": "thunderstorms-day-rain", "11n": "thunderstorms-night-rain",
      "13d": "snow",                   "13n": "snow",
      "50d": "mist",                   "50n": "mist"
    };

    // Si el código no está mapeado usa el PNG de OpenWeather; si el SVG existe
    // pero falla al cargar, el listener lo reemplaza. once evita el ciclo si el
    // fallback también falla.
    function ponerIcono(img, codigo, urlFallback) {
      const local = METEO[codigo];
      img.src = local ? `/icons/weather/${local}.svg` : (urlFallback || "");
      if (local && urlFallback) {
        img.addEventListener("error", () => { img.src = urlFallback; }, { once: true });
      }
    }

    let map = null, marker = null;

    // Leaflet viene de CDN y el resto del script vive en el mismo <script>: sin
    // este guard, "L is not defined" corta acá y se cae también el buscador.
    if (typeof L === "undefined") {
      $("mapaBox").innerHTML =
        '<div class="sinmapa">No se pudo cargar el mapa. El buscador funciona igual.</div>';
      $("mapaHint").remove();
    } else {
      map = L.map("map").setView([-41.13, -71.31], 6);   // Bariloche

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "© OpenStreetMap"
      }).addTo(map);

      map.on("click", (e) => cargarPorCoords(e.latlng.lat, e.latlng.lng));
    }

    function ponerMarker(lat, lon, ciudad, resumen) {
      if (!map) return;
      if (marker) marker.remove();

      // Nodos y textContent en vez de un string de HTML: el nombre viene de una
      // API externa.
      const popup = document.createElement("div");
      const nombre = document.createElement("b");
      nombre.textContent = ciudad;
      popup.append(nombre, document.createElement("br"), document.createTextNode(resumen));

      marker = L.marker([lat, lon]).addTo(map).bindPopup(popup).openPopup();
      map.setView([lat, lon], 9);
    }

    function renderClima(data) {
      ponerIcono($("icono"), data.iconoCodigo, data.iconoUrl);
      $("icono").alt = data.descripcion;
      $("ciudadNombre").textContent = `${data.ciudad}, ${data.pais}`;
      $("descripcion").textContent = data.descripcion;
      $("temp").textContent = `${data.temperaturaC}°`;
      $("sensacion").textContent = `${data.sensacionC}°`;
      $("humedad").textContent = `${data.humedadPct}%`;
      $("viento").textContent = `${data.vientoKmh} km/h`;

      card.classList.add("visible");
      ponerMarker(data.lat, data.lon, data.ciudad, `${data.temperaturaC}° · ${data.descripcion}`);
    }

    function tarjetaDia(d) {
      const el = document.createElement("div");
      el.className = "day";

      const dow = document.createElement("div");
      dow.className = "dow";
      dow.textContent = d.diaSemana.slice(0, 3);   // "MIÉ" entra, "MIÉRCOLES" no
      dow.title = d.diaSemana;

      const img = document.createElement("img");
      ponerIcono(img, d.iconoCodigo, d.iconoUrl);
      img.alt = d.descripcion;
      img.title = `${d.descripcion} · ${d.fecha}`;

      const max = document.createElement("div");
      max.className = "max";
      max.textContent = `${d.maxC}°`;

      const min = document.createElement("div");
      min.className = "min";
      min.textContent = `${d.minC}°`;

      el.append(dow, img, max, min);
      return el;
    }

    function renderPronostico(dias) {
      // Pueden venir 4: el backend descarta el último si llega parcial.
      $("forecastTitulo").textContent =
        dias.length === 1 ? "Mañana" : `Próximos ${dias.length} días`;

      $("days").replaceChildren(...dias.map(tarjetaDia));
      forecast.classList.add("visible");
    }

    function estado(texto, esError = false) {
      msg.textContent = texto;
      msg.classList.toggle("error", esError);
    }

    // Si no, ante un error queda visible la tarjeta de la consulta anterior.
    function ocultarResultados() {
      card.classList.remove("visible");
      forecast.classList.remove("visible");
    }

    let enCurso = null;

    async function cargar(qs) {
      // Cancela la búsqueda anterior: sin esto gana la respuesta que llega
      // última, que no es necesariamente la última pedida.
      enCurso?.abort();
      const ctrl = new AbortController();
      enCurso = ctrl;

      estado("Buscando...");
      ocultarResultados();
      boton.disabled = true;

      try {
        const [climaRes, pronRes] = await Promise.all([
          fetch(`/api/clima?${qs}`, { signal: ctrl.signal }),
          fetch(`/api/pronostico?${qs}`, { signal: ctrl.signal })
        ]);

        // fetch no tira ante un 4xx/5xx, sólo ante fallo de red: el status hay
        // que mirarlo a mano. Los errores traen { mensaje }.
        const clima = await climaRes.json();
        if (!climaRes.ok) {
          estado(clima.mensaje || "No se pudo obtener el clima.", true);
          return;
        }

        estado("");
        renderClima(clima);

        // El pronóstico es opcional: si falla igual mostramos el clima actual.
        if (pronRes.ok) renderPronostico(await pronRes.json());
      } catch (e) {
        // No es un error: la reemplazó una búsqueda más nueva, que ya se está
        // ocupando de la UI.
        if (e.name === "AbortError") return;
        estado("No se pudo conectar con el servidor.", true);
      } finally {
        // Sólo la búsqueda vigente devuelve el botón. Si a esta la abortó otra,
        // enCurso ya apunta al controller nuevo y le toca a él soltarlo.
        if (enCurso === ctrl) {
          enCurso = null;
          boton.disabled = false;
        }
      }
    }

    const cargarPorCiudad = (c) => cargar(`ciudad=${encodeURIComponent(c)}`);
    const cargarPorCoords = (lat, lon) => cargar(`lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`);

    function buscarLoEscrito() {
      const c = $("ciudad").value.trim();
      if (c) cargarPorCiudad(c);
    }

    boton.addEventListener("click", buscarLoEscrito);
    $("ciudad").addEventListener("keydown", (e) => {
      if (e.key === "Enter") buscarLoEscrito();
    });

    $("ciudad").value = "Bariloche";
    cargarPorCiudad("Bariloche");
  </script>
</body>
</html>
