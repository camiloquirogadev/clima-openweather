<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clima · OpenWeatherMap + ASP.NET Core</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #faf7f2; --card: #ffffff; --accent: #ea580c; --text: #292524; --muted: #78716c;
      --border: #ddcdb8; --inset: #f3ece1; --on-accent: #ffffff; --error: #dc2626;
      --shadow: 0 4px 16px -4px rgba(120, 72, 28, .18), 0 1px 3px rgba(120, 72, 28, .12);
      --ring: 0 0 0 3px rgba(234, 88, 12, .25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fffdf9, var(--bg));
      background-attachment: fixed;
      color: var(--text); min-height: 100vh; padding: 1.5rem 1rem;
      -webkit-font-smoothing: antialiased;
    }
    .app { width: 100%; max-width: 900px; margin: 0 auto; }
    h1 {
      font-size: 1.35rem; text-align: center; margin-bottom: 1.25rem; font-weight: 600;
      letter-spacing: -.01em;
    }
    h1 span { color: var(--accent); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .search { display: flex; gap: .5rem; max-width: 480px; margin: 0 auto 1rem; }
    input {
      flex: 1; padding: .75rem 1rem; border-radius: .75rem; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 1rem; outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); box-shadow: var(--ring); }
    button {
      padding: .75rem 1.25rem; border: none; border-radius: .75rem; cursor: pointer;
      background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 1rem;
      transition: filter .18s ease, transform .08s ease;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .6; cursor: default; }
    button:focus-visible { outline: none; box-shadow: var(--ring); }

    /* Mismo nodo para carga y error: .msg neutro, .msg.error rojo. */
    .msg { text-align: center; color: var(--muted); min-height: 1.2rem; margin-bottom: .75rem; font-size: .9rem; }
    .msg.error { color: var(--error); }

    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
    #map { height: 320px; border-radius: 1rem; border: 1px solid var(--border); z-index: 0; box-shadow: var(--shadow); }
    .hint { font-size: .75rem; color: var(--muted); text-align: center; margin-top: .5rem; }
    .sinmapa {
      height: 320px; display: grid; place-items: center; padding: 1rem; text-align: center;
      border: 1px dashed var(--border); border-radius: 1rem; color: var(--muted); font-size: .9rem;
    }

    .card {
      background: var(--card); border-radius: 1rem; padding: 1.25rem; text-align: center;
      border: 1px solid var(--border); box-shadow: var(--shadow); display: none;
    }
    .card.visible { display: block; animation: rise .35s ease both; }
    .city { font-size: 1.3rem; font-weight: 600; letter-spacing: -.01em; }
    .desc { color: var(--muted); margin-top: .1rem; }
    .temp {
      font-size: 2.85rem; font-weight: 700; margin: .1rem 0; line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .icon { width: 110px; height: 110px; margin: -1rem auto -.75rem; filter: drop-shadow(0 6px 12px rgba(0,0,0,.4)); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-top: .75rem; }
    .stat { background: var(--inset); border: 1px solid var(--border); border-radius: .75rem; padding: .55rem; }
    .stat .label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .stat .value { font-size: 1.05rem; font-weight: 600; margin-top: .15rem; font-variant-numeric: tabular-nums; }

    .forecast { margin-top: 1rem; display: none; }
    .forecast.visible { display: block; animation: rise .35s ease .05s both; }
    .forecast h2 { font-size: .95rem; color: var(--muted); font-weight: 600; margin-bottom: .5rem; }
    .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; }
    @media (max-width: 520px) { .days { grid-template-columns: repeat(2, 1fr); } }
    .day {
      background: var(--inset); border: 1px solid var(--border); border-radius: .75rem;
      padding: .6rem .4rem; text-align: center; box-shadow: var(--shadow);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .day:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
    .day .dow { font-size: .8rem; color: var(--muted); text-transform: capitalize; }
    .day img { width: 50px; height: 50px; margin: -.35rem auto; }
    .day .max { font-weight: 700; font-variant-numeric: tabular-nums; }
    .day .min { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, .card.visible, .forecast.visible { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Clima <span>·</span> ASP.NET Core + OpenWeatherMap</h1>

    <div class="search">
      <label class="sr-only" for="ciudad">Ciudad</label>
      <input id="ciudad" type="text" placeholder="Ej: Rosario, Buenos Aires, Madrid..." />
      <button id="buscar">Buscar</button>
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <div class="layout">
      <div>
        <div id="mapaBox">
          <div id="map"></div>
        </div>
        <div class="hint" id="mapaHint">Hacé clic en el mapa para ver el clima de ese punto</div>
      </div>

      <div class="card" id="card">
        <img class="icon" id="icono" alt="" />
        <div class="city" id="ciudadNombre"></div>
        <div class="desc" id="descripcion"></div>
        <div class="temp" id="temp"></div>
        <div class="grid">
          <div class="stat"><div class="label">Sensación</div><div class="value" id="sensacion"></div></div>
          <div class="stat"><div class="label">Humedad</div><div class="value" id="humedad"></div></div>
          <div class="stat"><div class="label">Viento</div><div class="value" id="viento"></div></div>
        </div>
      </div>
    </div>

    <div class="forecast" id="forecast">
      <h2 id="forecastTitulo">Pronóstico</h2>
      <div class="days" id="days"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const card = $("card"), forecast = $("forecast"), msg = $("msg"), boton = $("buscar");

    // Íconos Meteocons (MIT, Bas Milius) por código de OpenWeather.
    const METEO = {
      "01d": "clear-day",              "01n": "clear-night",
      "02d": "partly-cloudy-day",      "02n": "partly-cloudy-night",
      "03d": "cloudy",                 "03n": "cloudy",
      "04d": "overcast-day",           "04n": "overcast-night",
      "09d": "drizzle",                "09n": "drizzle",
      "10d": "partly-cloudy-day-rain", "10n": "partly-cloudy-night-rain",
      "11d": "thunderstorms-day-rain", "11n": "thunderstorms-night-rain",
      "13d": "snow",                   "13n": "snow",
      "50d": "mist",                   "50n": "mist"
    };

    function ponerIcono(img, codigo, urlFallback) {
      const local = METEO[codigo];
      img.src = local ? `/icons/weather/${local}.svg` : (urlFallback || "");
      if (local && urlFallback) {
        img.addEventListener("error", () => { img.src = urlFallback; }, { once: true });
      }
    }

    let map = null, marker = null;

    // Leaflet viene de CDN y el resto del script vive en el mismo <script>:
    // sin este guard, "L is not defined" corta la ejecución y también muere el buscador.
    if (typeof L === "undefined") {
      $("mapaBox").innerHTML =
        '<div class="sinmapa">No se pudo cargar el mapa. El buscador funciona igual.</div>';
      $("mapaHint").remove();
    } else {
      map = L.map("map").setView([-32.95, -60.65], 6);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap", maxZoom: 18
      }).addTo(map);
      map.on("click", (e) => cargarPorCoords(e.latlng.lat, e.latlng.lng));
    }

    function ponerMarker(lat, lon, ciudad, resumen) {
      if (!map) return;
      if (marker) marker.remove();
      const popup = document.createElement("div");
      const nombre = document.createElement("b");
      nombre.textContent = ciudad;
      popup.append(nombre, document.createElement("br"), document.createTextNode(resumen));
      marker = L.marker([lat, lon]).addTo(map).bindPopup(popup).openPopup();
      map.setView([lat, lon], 9);
    }

    function renderClima(data) {
      ponerIcono($("icono"), data.iconoCodigo, data.iconoUrl);
      $("icono").alt = data.descripcion;
      $("ciudadNombre").textContent = `${data.ciudad}, ${data.pais}`;
      $("descripcion").textContent = data.descripcion;
      $("temp").textContent = `${data.temperaturaC}°C`;
      $("sensacion").textContent = `${data.sensacionC}°C`;
      $("humedad").textContent = `${data.humedadPct}%`;
      $("viento").textContent = `${data.vientoKmh} km/h`;
      card.classList.add("visible");
      ponerMarker(data.lat, data.lon, data.ciudad, `${data.temperaturaC}°C · ${data.descripcion}`);
    }

    function tarjetaDia(d) {
      const el = document.createElement("div");
      el.className = "day";

      const dow = document.createElement("div");
      dow.className = "dow";
      dow.textContent = d.diaSemana;

      const img = document.createElement("img");
      ponerIcono(img, d.iconoCodigo, d.iconoUrl);
      img.alt = d.descripcion;
      img.title = `${d.descripcion} · ${d.fecha}`;

      const max = document.createElement("div");
      max.className = "max";
      max.textContent = `${d.maxC}°`;

      const min = document.createElement("div");
      min.className = "min";
      min.textContent = `${d.minC}°`;

      el.append(dow, img, max, min);
      return el;
    }

    function renderPronostico(dias) {
      // Pueden venir 4 días: el backend descarta el último si llega parcial.
      $("forecastTitulo").textContent =
        dias.length === 1 ? "Mañana" : `Próximos ${dias.length} días`;

      const cont = $("days");
      cont.replaceChildren(...dias.map(tarjetaDia));
      forecast.classList.add("visible");
    }

    function estado(texto, esError = false) {
      msg.textContent = texto;
      msg.classList.toggle("error", esError);
    }

    function ocultarResultados() {
      card.classList.remove("visible");
      forecast.classList.remove("visible");
    }

    let enCurso = null;

    async function cargar(qs) {
      // Aborta la request anterior: sin esto pinta la respuesta que llega última,
      // que no es necesariamente la última pedida.
      enCurso?.abort();
      const ctrl = new AbortController();
      enCurso = ctrl;

      estado("Buscando...");
      ocultarResultados();
      boton.disabled = true;

      try {
        const [climaRes, pronRes] = await Promise.all([
          fetch(`/api/clima?${qs}`, { signal: ctrl.signal }),
          fetch(`/api/pronostico?${qs}`, { signal: ctrl.signal })
        ]);

        const clima = await climaRes.json();
        if (!climaRes.ok) {
          estado(clima.mensaje || "No se pudo obtener el clima.", true);
          return;
        }

        estado("");
        renderClima(clima);
        if (pronRes.ok) renderPronostico(await pronRes.json());
      } catch (e) {
        if (e.name === "AbortError") return;
        estado("No se pudo conectar con el servidor.", true);
      } finally {
        if (enCurso === ctrl) {
          enCurso = null;
          boton.disabled = false;
        }
      }
    }

    const cargarPorCiudad = (c) => cargar(`ciudad=${encodeURIComponent(c)}`);
    const cargarPorCoords = (lat, lon) => cargar(`lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`);

    function buscarLoEscrito() {
      const c = $("ciudad").value.trim();
      if (c) cargarPorCiudad(c);
    }

    boton.addEventListener("click", buscarLoEscrito);
    $("ciudad").addEventListener("keydown", (e) => {
      if (e.key === "Enter") buscarLoEscrito();
    });

    $("ciudad").value = "Rosario";
    cargarPorCiudad("Rosario");
  </script>
</body>
</html>
